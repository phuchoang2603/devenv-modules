name: devenv

on:
  workflow_call:
    inputs:
      run:
        description: Command to run inside the devenv shell.
        type: string
        default: devenv tasks run repo:check
      fetch-depth:
        type: number
        default: 1
      timeout-minutes:
        type: number
        default: 30
      cache-path:
        description: Extra paths to cache between runs, one per line.
        type: string
        default: ""
      cache-key:
        description: Prefix of the cache key; each run saves a new entry and restores the newest one with the same prefix and hash.
        type: string
        default: ""
      cache-hash-files:
        description: Glob whose content hash is part of the cache key.
        type: string
        default: devenv.lock
      artifact-name:
        description: Artifact name; slashes become dashes.
        type: string
        default: ""
      artifact-path:
        description: Paths to upload as an artifact after the run, even when it fails.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: devenv-${{ runner.os }}-${{ hashFiles('**/devenv.lock', '**/devenv.nix') }}
          restore-prefixes-first-match: devenv-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - uses: actions/cache@v4
        if: inputs.cache-path != ''
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}-${{ hashFiles(inputs.cache-hash-files) }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache-key }}-${{ hashFiles(inputs.cache-hash-files) }}-
            ${{ inputs.cache-key }}-
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run
        env:
          RUN: ${{ inputs.run }}
        run: devenv shell -- bash -euo pipefail -c "$RUN"
      - id: artifact
        if: always() && inputs.artifact-path != ''
        env:
          NAME: ${{ inputs.artifact-name }}
        run: echo "name=${NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && inputs.artifact-path != ''
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: warn
