id: no-comments-python
language: python
severity: error
message: Comments are not allowed; prefer names, types and checks.
note: Keep a comment only for a non-obvious invariant, protocol quirk or security caveat, and prefix it with NOTE.
ignores:
  - "**/.terraform.lock.hcl"
rule:
  kind: comment
  not:
    any:
      - regex: '^#!|^# ?(noqa|type:|pragma|NOTE:|pyright:|-\*- coding)|^# fmt: (off|on|skip)|^# ///( script)?$|^# (requires-python|dependencies)'
      - inside:
          stopBy: end
          has:
            kind: comment
            regex: '(?i)generated.*do not edit'

